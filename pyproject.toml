[project]
name = "omniswarm"
version = "1.2.0"
description = "A trust layer over cheap compute: offload bulk LLM work to free models via OmniRoute, with a council that QCs the result before it costs a Claude token."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex Jankuv" }]
keywords = ["llm", "openai-compatible", "self-hosted", "ai-council", "quality-control", "free-models", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "mcp>=1.0"]
mcp = ["mcp>=1.0"]

[project.scripts]
omniswarm-mcp = "omniswarm.mcp_server:main"
omniswarm = "omniswarm.cli:main"
omniswarm-serve = "omniswarm.serve:main"

[project.urls]
Homepage = "https://github.com/ajankuv/omniswarm"
Repository = "https://github.com/ajankuv/omniswarm"
Issues = "https://github.com/ajankuv/omniswarm/issues"

[tool.setuptools]
packages = ["omniswarm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
